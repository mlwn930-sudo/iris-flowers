<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="אגם — יועצת הזרים">
  <defs>
    <radialGradient id="agBg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#5B3A87"/>
      <stop offset="60%" stop-color="#341B55"/>
      <stop offset="100%" stop-color="#1C0B2E"/>
    </radialGradient>
    <linearGradient id="agHair" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#4A2C18"/>
      <stop offset="55%" stop-color="#2E1A0E"/>
      <stop offset="100%" stop-color="#1A0E07"/>
