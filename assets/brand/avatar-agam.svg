    <path d="M60 60v5" stroke="#C99574" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <path d="M54 70c3 3 9 3 12 0" stroke="#B4574F" stroke-width="2.2" fill="none" stroke-linecap="round"/>

