    <ellipse cx="67.5" cy="57" rx="3.1" ry="3.4" fill="#2E1A0E"/>
    <circle cx="53.5" cy="56" r="1.1" fill="#fff" opacity=".9"/>
    <circle cx="68.5" cy="56" r="1.1" fill="#fff" opacity=".9"/>

