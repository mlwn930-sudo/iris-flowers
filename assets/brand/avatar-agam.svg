    <path d="M28 62c0-23 14-38 32-38s32 15 32 38c0 16-3 27-6 34-2-14-1-28-4-36-10 5-34 6-44-2-3 9-4 24-4 38-4-8-6-19-6-34z" fill="url(#agHair)"/>

    <!-- צוואר -->
    <path d="M52 76h16v14c0 5-16 5-16 0z" fill="#D9A886"/>

    <!-- פנים -->
    <ellipse cx="60" cy="58" rx="20" ry="24" fill="url(#agSkin)"/>

    <!-- גבות -->
    <path d="M48 50c3-2 7-2 9 0" stroke="#3A2214" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M63 50c2-2 6-2 9 0" stroke="#3A2214" stroke-width="2" fill="none" stroke-linecap="round"/>

