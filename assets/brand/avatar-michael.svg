    <rect x="28" y="56" width="10" height="17" rx="5" fill="url(#miSteel)"/>
    <rect x="82" y="56" width="10" height="17" rx="5" fill="url(#miSteel)"/>
    <!-- מיקרופון -->
    <path d="M33 73c0 10 8 15 17 16" stroke="url(#miSteel)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="51" cy="89" r="3.4" fill="#D6EEF9"/>
