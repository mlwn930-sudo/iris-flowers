    <linearGradient id="miSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7FBEDC"/>
      <stop offset="50%" stop-color="#D6EEF9"/>
      <stop offset="100%" stop-color="#4E90B4"/>
    </linearGradient>
    <clipPath id="miClip"><circle cx="60" cy="60" r="56"/></clipPath>
  </defs>

  <circle cx="60" cy="60" r="56" fill="url(#miBg)"/>

  <g clip-path="url(#miClip)">
    <!-- כתפיים -->
    <path d="M16 120c3-22 20-33 44-33s41 11 44 33z" fill="#12303F"/>
    <path d="M60 87c-9 0-15 4-15 4l15 29 15-29s-6-4-15-4z" fill="#1B4257"/>
    <!-- צווארון -->
    <path d="M52 88l8 10 8-10-8-4z" fill="#D6EEF9" opacity=".85"/>

    <!-- צוואר -->
    <path d="M52 75h16v13c0 5-16 5-16 0z" fill="#CFA079"/>

    <!-- פנים -->
