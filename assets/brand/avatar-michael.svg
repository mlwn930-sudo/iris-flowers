<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="מיכאל — תמיכה טכנית">
  <defs>
    <radialGradient id="miBg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#2A6A92"/>
      <stop offset="60%" stop-color="#17405A"/>
      <stop offset="100%" stop-color="#0C1C28"/>
    </radialGradient>
    <linearGradient id="miHair" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#3A2A1E"/>
      <stop offset="60%" stop-color="#241A12"/>
      <stop offset="100%" stop-color="#150F0A"/>
    </linearGradient>
    <linearGradient id="miSkin" x1="30%" y1="10%" x2="70%" y2="95%">
      <stop offset="0%" stop-color="#F2CFB2"/>
      <stop offset="100%" stop-color="#D9AC86"/>
