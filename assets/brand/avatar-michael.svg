    <!-- שיער קצר -->
    <path d="M39 52c0-14 9-24 21-24s21 10 21 24c0-6-5-10-9-11-4 3-20 4-27 0-3 2-6 5-6 11z" fill="url(#miHair)"/>

    <!-- גבות -->
    <path d="M48 49c3-2 7-2 9 1" stroke="#2A1D12" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M63 50c2-3 6-3 9-1" stroke="#2A1D12" stroke-width="2.4" fill="none" stroke-linecap="round"/>

    <!-- עיניים -->
    <ellipse cx="52.5" cy="57" rx="3" ry="3.3" fill="#26190F"/>
    <ellipse cx="67.5" cy="57" rx="3" ry="3.3" fill="#26190F"/>
    <circle cx="53.5" cy="56" r="1.1" fill="#fff" opacity=".9"/>
    <circle cx="68.5" cy="56" r="1.1" fill="#fff" opacity=".9"/>

    <!-- אף וחיוך -->
    <path d="M60 59v5" stroke="#BF8F6B" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <path d="M54 69c3 3 9 3 12 0" stroke="#9E5147" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <!-- זקן קל -->
    <path d="M46 63c1 10 7 16 14 16s13-6 14-16c-2 12-8 14-14 14s-12-2-14-14z" fill="#2A1D12" opacity=".2"/>

